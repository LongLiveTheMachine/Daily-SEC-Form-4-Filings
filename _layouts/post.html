<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InsiderIQ Pro — Latest Insights</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--black:#0a0a0b;--gold:#c9a84c;--white:#f5f4ef;--border:rgba(255,255,255,0.08);--font-display:'Bebas Neue',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'DM Mono',monospace;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--black);color:var(--white);font-family:var(--font-body);}
  nav{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 3rem;border-bottom:1px solid var(--border);}
  .nav-logo{font-family:var(--font-display);font-size:1.5rem;color:var(--gold);text-decoration:none;}
  .nav-logo span{color:var(--white);}
  .nav-back{font-size:0.82rem;color:#9a9aa5;text-decoration:none;}
  .nav-back:hover{color:var(--white);}
  .page-content{max-width:800px;margin:6rem auto;padding:0 2rem;}
  h1{font-family:var(--font-display);font-size:clamp(3rem,6vw,5rem);letter-spacing:0.02em;margin-bottom:1rem;}
  h1 em{font-style:normal;color:var(--gold);}
  .page-label{font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.25em;color:var(--gold);text-transform:uppercase;margin-bottom:1rem;}
  .page-body{font-size:1rem;color:#c8c8bc;line-height:1.8;font-weight:300;margin-top:2rem;}
  footer{padding:2rem 3rem;border-top:1px solid var(--border);text-align:center;font-size:0.75rem;color:#6a6a75;margin-top:6rem;}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">InsiderIQ<span>Pro</span></a>
  <a href="/blog/" class="nav-back">← Back to Blog</a>
</nav>
<div class="page-content">
  <p class="page-label">// Insider Filing Breakdown</p>
  
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <span>Published: {{ page.date | date: "%B %d, %Y" }}</span>
      {% if page.author %} • <span>Author: {{ page.author }}</span>{% endif %}
    </div>
  </header>

  <article class="post-body">
    {{ content }}
  </article>
</div>
<footer>© 2026 InsiderIQ Pro. All rights reserved.</footer>
</body>
</html>

</body>
</html>
